name: Apply Daily Report output cleanup v2

on:
  push:
    branches:
      - agent/clean-daily-report-public-output

permissions:
  contents: write

concurrency:
  group: agent-clean-daily-report-public-output-v2
  cancel-in-progress: false

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} copies of {old!r}, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("docs/research/agent-trace-evidence-budget.md", "## Scope, limitations, and falsification", "## What would change this conclusion?")
          replace("docs/research/agent-trace-evidence-budget.md", "credential scope Z", "credential permissions Z")
          replace("docs/research/agent-trace-evidence-budget.md", "principal, credential scope, sandbox/policy version", "principal, credential permissions, sandbox/policy version")
          replace("docs/research/agent-trace-evidence-budget.md", "should be scoped to a durable agent work unit", "should follow a durable agent work unit")

          replace("docs/research/agent-trace-evidence-budget.zh.md", "## 适用范围、局限与可证伪条件", "## 哪些结果会改变这个判断？")
          replace("docs/research/agent-trace-evidence-budget.zh.md", "credential scope Z", "credential permissions Z")
          replace("docs/research/agent-trace-evidence-budget.zh.md", "principal、credential scope、sandbox/policy version", "principal、credential permissions、sandbox/policy version")
          replace("docs/research/agent-trace-evidence-budget.zh.md", "Hubble 也清楚展示了局限。", "Hubble 同时暴露了一个边界。")

          replace("docs/research/parallel-agent-effect-serializability.md", "## Scope, limitations, and falsification", "## What would change this conclusion?")
          replace("docs/research/parallel-agent-effect-serializability.md", "principal, scope, target", "principal, permissions, target", expected=2)

          replace("docs/research/parallel-agent-effect-serializability.zh.md", "## 适用范围与可证伪条件", "## 哪些结果会改变这个判断？")
          replace("docs/research/parallel-agent-effect-serializability.zh.md", "principal、scope、目标", "principal、权限边界、目标")
          replace("docs/research/parallel-agent-effect-serializability.zh.md", "它也有明显局限：", "这套设计还会遇到几类困难：")

          for path in [
              "docs/research/parallel-agent-effect-serializability.md",
              "docs/research/parallel-agent-effect-serializability.zh.md",
          ]:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text, count = re.subn(
                  r"(?m)^(\s*)scope:\s*repository:eunomia/service-a\s*$",
                  r"\1permissions: repository:eunomia/service-a",
                  text,
              )
              if count != 1:
                  raise SystemExit(f"{path}: expected one manifest scope field, found {count}")
              p.write_text(text, encoding="utf-8")

          page_path = Path("app/lib/page-factories.tsx")
          page = page_path.read_text(encoding="utf-8")
          if page.count("  HeadingEntry,\n") != 1:
              raise SystemExit("unexpected HeadingEntry import count")
          page = page.replace("  HeadingEntry,\n", "")
          page, count = re.subn(
              r"\nconst dailyReportTextReplacements:.*?\nfunction renderCustomReactPage",
              "\nfunction renderCustomReactPage",
              page,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one render replacement helper block, found {count}")
          page, count = re.subn(
              r"  const headings =\n    page\.layout === \"document\"\n      \? dailyReport\n        \? rewriteDailyReportHeadings\(page\.headings, locale\)\n        : page\.headings\n      : \[\];\n  const bodyHtml = dailyReport \? rewriteDailyReportText\(page\.bodyHtml, locale\) : page\.bodyHtml;\n",
              "  const headings = page.layout === \"document\" ? page.headings : [];\n",
              page,
          )
          if count != 1:
              raise SystemExit(f"expected one body rewrite block, found {count}")
          if page.count("      <MarkdownContent html={bodyHtml} />") != 1:
              raise SystemExit("unexpected MarkdownContent bodyHtml count")
          page = page.replace("      <MarkdownContent html={bodyHtml} />", "      <MarkdownContent html={page.bodyHtml} />")
          page_path.write_text(page, encoding="utf-8")

          skill_path = Path(".agents/skills/eunomia-research-report/SKILL.md")
          skill = skill_path.read_text(encoding="utf-8")
          edits = [
              ("## Non-Negotiable Public Contract", "## Non-Negotiable Publishing Rules"),
              ("- It is explicitly labeled **AI-generated and not human-reviewed** near the top\n  and again at the bottom of the rendered page.", "- The rendered page carries one low-contrast disclosure line at the absolute\n  bottom, after navigation, feedback, and sharing controls. Do not place a\n  review-status banner at the top."),
              ("experimental scope", "experimental bounds"),
              ("an author's limitation paragraph", "an author's caveat paragraph"),
              ("- displays the AI-generated, not-human-reviewed notice near the top;\n- repeats the notice at the bottom;", "- displays one low-contrast review-status note only at the absolute bottom;\n- does not display a disclosure banner before or inside the report body;"),
              ("the gap section contains generic limitations", "the gap section contains generic caveats"),
          ]
          for old, new in edits:
              if skill.count(old) != 1:
                  raise SystemExit(f"SKILL.md: expected one {old!r}, found {skill.count(old)}")
              skill = skill.replace(old, new)
          skill_path.write_text(skill, encoding="utf-8")

          method_path = Path(".agents/skills/eunomia-research-report/references/research-method.md")
          method = method_path.read_text(encoding="utf-8")
          edits = [
              ("Every public report is AI-generated and not human-reviewed unless a named human\nreview is explicitly recorded. This editorial status must be visible near the\ntop and bottom of every rendered page.", "Every public report is generated by the automated reporting workflow unless a\nnamed human review is explicitly recorded. The rendered page carries one quiet\nreview-status line only at the absolute bottom, after the page controls."),
              ("- limitation and possible conflict of interest;", "- caveats and possible conflicts of interest;"),
              ("repeat limitation\nparagraphs", "repeat caveat\nparagraphs"),
              ("8. evaluation, limitations, and falsification.", "8. evaluation, uncertainty, and falsification."),
              ("The rendered page must say, near the top and bottom, that:\n\n- it was generated with automated research and writing tools;\n- no human editor verified every citation, fact, metric, or recommendation;\n- errors may remain;\n- readers should inspect primary sources and independently validate important\n  conclusions.\n\nDo not expose a human Git committer as an article author by default.", "The rendered page must show one low-contrast, single-line status note only at\nthe absolute bottom, after navigation, feedback, and sharing controls. Do not\nplace a disclosure banner at the top or repeat the note inside the report body.\nThe section index should introduce the reports and list current entries, not\npublish an editorial contract, route-history explanation, or internal process\nchecklist.\n\nDo not expose a human Git committer as an article author by default."),
              ("- title, description, opening, gaps, ideas, limits, and references;", "- title, description, opening, gaps, ideas, conclusion checks, and references;"),
              ("- disclosure near the top and bottom of every section page;", "- one low-contrast status note at the absolute bottom of every section page;"),
              ("Cadence never overrides the publication\ncontract.", "Cadence never overrides the publication\nstandard."),
          ]
          for old, new in edits:
              if method.count(old) != 1:
                  raise SystemExit(f"research-method.md: expected one {old!r}, found {method.count(old)}")
              method = method.replace(old, new)
          method_path.write_text(method, encoding="utf-8")

          public_agents = Path("docs/research/AGENTS.md")
          if not public_agents.exists():
              raise SystemExit("docs/research/AGENTS.md is missing")
          public_agents.unlink()

          public_files = [
              Path("docs/research/agent-trace-evidence-budget.md"),
              Path("docs/research/agent-trace-evidence-budget.zh.md"),
              Path("docs/research/parallel-agent-effect-serializability.md"),
              Path("docs/research/parallel-agent-effect-serializability.zh.md"),
          ]
          forbidden_en = re.compile(r"\b(?:scope|scoped|limitation|limitations)\b", re.I)
          forbidden_zh = re.compile(r"局限|适用范围")
          for p in public_files:
              text = p.read_text(encoding="utf-8")
              for pattern in (forbidden_en, forbidden_zh):
                  match = pattern.search(text)
                  if match:
                      line = text.count("\n", 0, match.start()) + 1
                      raise SystemExit(f"{p}:{line}: forbidden public term {match.group()!r}")

          if any(token in page for token in ("dailyReportTextReplacements", "rewriteDailyReportText", "rewriteDailyReportHeadings")):
              raise SystemExit("temporary render replacements remain")
          if "near the top" in skill or "top and bottom" in skill:
              raise SystemExit("old disclosure placement remains in SKILL.md")
          if "near the top and bottom" in method:
              raise SystemExit("old disclosure placement remains in research-method.md")
          PY

      - name: Commit cleanup and remove helper workflows
        run: |
          set -euo pipefail
          rm .github/workflows/agent-clean-daily-report-output.yml
          rm .github/workflows/agent-clean-daily-report-output-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean Daily Report public output"
          git push origin HEAD
