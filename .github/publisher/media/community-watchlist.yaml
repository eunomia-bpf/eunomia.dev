version: 3
purpose: >-
  Approved sources for recurring technical-question monitoring. This file is an
  allowlist, not a credential store. Slack sources may individually opt in to
  an approved private read-only archive; all other sources remain
  visible-browser-only.

policy:
  cadence: daily
  max_public_qa_per_day: 1
  publish_one_combined_qa_and_brief_per_successful_run: true
  primary_review_window_hours: 24
  unresolved_question_fallback_days: 7
  require_real_question: true
  require_public_primary_sources: true
  review_all_accessible_allowlisted_channels: true
  visible_browser_for_chat: true
  slack_archive_opt_in: per_source
  archive_dsn_env: EUNOMIA_QA_ARCHIVE_DSN
  archive_mode: read_only
  exclude_private_channels: true
  exclude_direct_messages: true
  store_raw_transcripts: false
  public_output: docs/ebpf-qa/
  article_order:
    - detailed answer
    - references
    - anonymized daily community discussion

sources:
  - id: eunomia-discord
    surface: Discord
    workspace: eunomia-bpf
    priority: primary
    channels:
      - general
      - github
      - blog-and-tutorials
      - help-and-questions
      - agentsight
      - actplane
      - akeep
      - bpftime
    topics:
      - project usage
      - eBPF development questions
      - documentation gaps

  - id: sched-ext-discord
    surface: Discord
    workspace: sched-ext
    priority: primary
    channels:
      - questions
      - support
    topics:
      - sched_ext
      - scheduler debugging
      - workload evaluation

  - id: cilium-ebpf-slack
    surface: Slack
    workspace: Cilium & eBPF
    join_url: https://slack.cilium.io/
    archive_opt_in: true
    priority: primary
    channels:
      - ebpf
    topics:
      - eBPF development
      - verifier and loader behavior
      - networking and observability

  - id: cncf-slack
    surface: Slack
    workspace: Cloud Native Computing Foundation
    join_url: https://slack.cncf.io/
    archive_opt_in: true
    priority: primary
    channels:
      - otel-ebpf-instrumentation
      - otel-genai-instrumentation
    topics:
      - OpenTelemetry eBPF Instrumentation
      - privacy-aware observability
      - AI agent telemetry

  - id: bpf-mailing-list
    surface: mailing-list
    workspace: bpf@vger.kernel.org
    public_archive: https://lore.kernel.org/bpf/
    priority: primary
    topics:
      - kernel BPF development
      - verifier behavior
      - libbpf and tooling

  - id: reddit-ebpf
    surface: Reddit
    workspace: r/eBPF
    public_url: https://www.reddit.com/r/eBPF/
    priority: secondary
    topics:
      - practitioner questions
      - project discovery

excluded:
  - restricted Discord channels
  - private Slack channels
  - direct messages
  - customer or partner conversations
  - channels not explicitly listed above
  - Slack archive connections without watchlist opt-in
  - read-write or admin archive connections
